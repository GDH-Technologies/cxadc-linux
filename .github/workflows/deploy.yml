name: Deploy cxadc-linux to cs0, cs1, and wm

on:
  # Deploy is gated on "Build and Test" succeeding for the same commit. These
  # used to be two independent push-triggered workflows racing for the same
  # self-hosted runners, so deploy could (and did) ship a commit to all three
  # capture rigs before CI had compiled it even once.
  #
  # build.yml's path filters must stay a superset of what deploy cares about,
  # otherwise a deploy-relevant change never triggers a build and so never
  # reaches deploy either.
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_reinstall:
        description: "Run deploy steps even if no relevant files changed"
        required: false
        type: boolean
        default: false
      reload_module:
        description: "Unload/reload cxadc module after install (can disrupt active captures)"
        required: false
        type: boolean
        default: false
      target_kernel:
        description: "Kernel release to install DKMS module for (empty = current uname -r)"
        required: false
        type: string
        default: ""
      install_all_kernels:
        description: "Build/install DKMS module for all /lib/modules kernels"
        required: false
        type: boolean
        default: true
      prune_old_versions:
        description: "Remove superseded cxadc DKMS versions, sources and orphaned modules"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-cxadc-linux
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on ${{ matrix.host }}
    # workflow_run fires on *completion*, success or not -- gate on conclusion.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        host: [cs0, cs1, wm]
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ${{ matrix.host }}

    steps:
      - name: Build and deploy
        shell: bash
        env:
          REPO_DIR: /home/rdodge/Repos/cxadc-linux
          BRANCH: master
          FORCE_REINSTALL: ${{ inputs.force_reinstall }}
          RELOAD_MODULE: ${{ inputs.reload_module }}
          DKMS_TARGET_KERNEL: ${{ inputs.target_kernel }}
          DKMS_INSTALL_ALL_KERNELS: ${{ inputs.install_all_kernels }}
          PRUNE_OLD_DKMS_VERSIONS: ${{ inputs.prune_old_versions }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          echo "Repo: ${REPO_DIR}"
          echo "Branch: ${BRANCH}"
          echo "Force reinstall: ${FORCE_REINSTALL:-false}"
          echo "Reload module: ${RELOAD_MODULE:-false}"
          echo "DKMS target kernel: ${DKMS_TARGET_KERNEL:-}"
          echo "DKMS install all kernels: ${DKMS_INSTALL_ALL_KERNELS:-true}"
          echo "Prune old DKMS versions: ${PRUNE_OLD_DKMS_VERSIONS:-true}"

          if [ ! -d "${REPO_DIR}/.git" ]; then
            echo "Repo not found at ${REPO_DIR}" >&2
            exit 1
          fi

          cd "${REPO_DIR}"

          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "${current_branch}" != "${BRANCH}" ]; then
            echo "Expected branch ${BRANCH}, found ${current_branch}" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty. Refusing to deploy:" >&2
            git status --porcelain
            exit 1
          fi

          git fetch --prune origin
          old_rev="$(git rev-parse HEAD)"
          git pull --ff-only origin "${BRANCH}"
          new_rev="$(git rev-parse HEAD)"

          echo "Revision: ${old_rev} -> ${new_rev}"

          echo "Checking DKMS version consistency (dkms.conf, kernel source, README, INSTALL)..."
          dkms_version="$(awk -F= '/^PACKAGE_VERSION=/{gsub(/"/,"",$2); print $2}' dkms.conf)"
          kernel_version="$(sed -nE 's/.*version ([0-9]+(\.[0-9]+)*)/\1/p' src/kernel/cxadc.c | head -n1)"
          readme_version="$(sed -nE 's/.*Current DKMS package version:[[:space:]]*`([^`]+)`.*/\1/p' README.md | head -n1)"
          install_doc_version="$(sed -nE 's/.*DKMS package version[[:space:]]*`([^`]+)`.*/\1/p' INSTALL.md | head -n1)"

          if [ -z "${dkms_version}" ] || [ -z "${kernel_version}" ] || [ -z "${readme_version}" ] || [ -z "${install_doc_version}" ]; then
            echo "ERROR: missing version marker in dkms.conf/src/kernel/cxadc.c/README.md/INSTALL.md" >&2
            exit 1
          fi
          if [ "${dkms_version}" != "${kernel_version}" ] || [ "${dkms_version}" != "${readme_version}" ] || [ "${dkms_version}" != "${install_doc_version}" ]; then
            echo "ERROR: version mismatch detected" >&2
            echo "  dkms.conf: ${dkms_version}" >&2
            echo "  src/kernel/cxadc.c: ${kernel_version}" >&2
            echo "  README.md: ${readme_version}" >&2
            # INSTALL.md is compared above but was never printed, so a mismatch
            # caused by it reported three identical versions and named nothing.
            echo "  INSTALL.md: ${install_doc_version}" >&2
            exit 1
          fi

          # What is installed on THIS host, not what this checkout happens to
          # contain. The old check compared the repo's HEAD before and after
          # the pull, which silently no-ops on whichever rig the developer
          # pushed from -- its working copy is already at the new revision, so
          # old_rev == new_rev and the host skipped its own deploy while
          # reporting success. That is exactly how wm missed a fix that cs0 and
          # cs1 received.
          # Deliberately user-writable: run_as_root uses `sudo -n` against a
          # scoped sudoers rule, and this is CI bookkeeping, not system state
          # worth widening that rule for. Per-runner-home is exactly the right
          # granularity anyway. A missing or stale stamp fails safe -- it
          # redeploys, which is idempotent, rather than skipping.
          stamp_file="${HOME:-/tmp}/.local/state/cxadc-deploy/deployed-sha"
          deployed_rev="$(cat "${stamp_file}" 2>/dev/null || echo none)"

          if [ -n "${TESTED_SHA:-}" ] && [ "${TESTED_SHA}" != "${new_rev}" ]; then
            echo "NOTE: master has moved since the tested commit."
            echo "  tested:   ${TESTED_SHA}"
            echo "  deploying: ${new_rev}"
          fi

          echo "Deployed revision on this host: ${deployed_rev}"
          echo "Target revision:                ${new_rev}"

          deploy_needed="false"
          if [ "${FORCE_REINSTALL:-false}" = "true" ]; then
            deploy_needed="true"
            echo "Force reinstall requested"
          elif [ "${deployed_rev}" != "${new_rev}" ]; then
            deploy_needed="true"
          fi

          if [ "${deploy_needed}" != "true" ]; then
            echo "Host already running ${new_rev}; skipping install"
            exit 0
          fi

          echo "Building module and userspace tools..."
          make clean
          make

          # These three variables, in this order, are what
          # /etc/sudoers.d/cxadc-linux-deploy matches on. sudo compares the
          # command line positionally, so adding, removing or reordering one
          # silently drops the NOPASSWD alias and every deploy starts prompting
          # for a password. Change this line only alongside that sudoers file on
          # cs0, cs1 and wm. (DKMS_PRUNE_DRY_RUN is deliberately absent for
          # exactly this reason -- it is a root-shell-only knob.)
          #
          # The :- fallbacks are not decoration: workflow_run deploys leave
          # inputs.* empty, so they, not the input defaults above, decide the
          # behaviour of an automatic deploy.
          echo "Installing tools/config and DKMS module via root helper..."
          run_as_root env \
            DKMS_TARGET_KERNEL="${DKMS_TARGET_KERNEL:-}" \
            DKMS_INSTALL_ALL_KERNELS="${DKMS_INSTALL_ALL_KERNELS:-true}" \
            PRUNE_OLD_DKMS_VERSIONS="${PRUNE_OLD_DKMS_VERSIONS:-true}" \
            /usr/bin/bash "${REPO_DIR}/src/scripts/deploy_dkms_install.sh"

          if [ "${RELOAD_MODULE:-false}" = "true" ]; then
            modprobe_bin="$(command -v modprobe)"
            if [ -z "${modprobe_bin}" ]; then
              echo "ERROR: modprobe not found" >&2
              exit 1
            fi
            echo "Reloading cxadc module..."
            # `modprobe -r ... || true` used to swallow every removal failure.
            # That conflates two very different cases: "not currently loaded"
            # (fine, fall through and load it) and "module is in use" (NOT
            # fine). In the second case the subsequent modprobe is a no-op
            # because the module is still resident, so the job reported a
            # successful reload while leaving the OLD module loaded -- on
            # capture rigs, where the module being busy is the normal state.
            if lsmod | grep -q '^cxadc'; then
              cxadc_refs="$(lsmod | awk '/^cxadc/{print $3}')"
              if [ "${cxadc_refs}" != "0" ]; then
                echo "ERROR: cxadc is in use (refcount ${cxadc_refs}); refusing to reload." >&2
                echo "       A capture is most likely running. Retry when the card is" >&2
                echo "       idle, or reboot to pick up the new module." >&2
                exit 1
              fi
              run_as_root "${modprobe_bin}" -r cxadc
            else
              echo "cxadc not currently loaded; loading it"
            fi
            run_as_root "${modprobe_bin}" cxadc
            if ! lsmod | grep -q '^cxadc'; then
              echo "ERROR: cxadc did not load after reload" >&2
              exit 1
            fi
            echo "cxadc reloaded"
          else
            echo "Skipping module reload (reload_module=false)"
          fi

          echo "Running post-deploy checks..."
          if ! command -v cx-capture >/dev/null 2>&1; then
            echo "ERROR: cx-capture not found in PATH after install" >&2
            exit 1
          fi
          if ! command -v leveladj >/dev/null 2>&1; then
            echo "ERROR: leveladj not found in PATH after install" >&2
            exit 1
          fi
          if ! command -v cxadc-status >/dev/null 2>&1; then
            echo "ERROR: cxadc-status not found in PATH after install" >&2
            exit 1
          fi

          python3 -m py_compile src/tools/cxadc-status/cxadc-status
          python3 src/tools/cxadc-status/cxadc-status --plain --no-color || true

          dkms_name="$(awk -F= '/^PACKAGE_NAME=/{gsub(/"/,"",$2); print $2}' dkms.conf)"
          dkms_version="$(awk -F= '/^PACKAGE_VERSION=/{gsub(/"/,"",$2); print $2}' dkms.conf)"

          dkms_status="$(dkms status -m "${dkms_name}" -v "${dkms_version}" || true)"
          echo "${dkms_status}"
          if ! echo "${dkms_status}" | grep -qE "^${dkms_name}/${dkms_version}, .*: installed"; then
            echo "ERROR: target DKMS version is not installed" >&2
            exit 1
          fi
          if echo "${dkms_status}" | grep -qE "^${dkms_name}/${dkms_version}, .*: built$"; then
            echo "ERROR: target DKMS version is built but not installed for at least one kernel" >&2
            exit 1
          fi
          if echo "${dkms_status}" | grep -q "Differences between built and installed modules"; then
            echo "ERROR: target DKMS version reports installed-module drift" >&2
            exit 1
          fi

          # DEST_MODULE_LOCATION in dkms.conf asks for /updates/dkms, but
          # Fedora's DKMS overrides it and installs to extra/. Accept either,
          # so the check still catches a module coming from somewhere that is
          # not DKMS-managed at all.
          modinfo_path="$(modinfo -n cxadc)"
          if ! echo "${modinfo_path}" | grep -qE '/(updates/dkms|extra)/'; then
            echo "ERROR: cxadc module path is not DKMS-managed (expected updates/dkms or extra): ${modinfo_path}" >&2
            exit 1
          fi

          running_kernel="$(uname -r)"
          if ! modinfo -F vermagic cxadc | grep -q "${running_kernel}"; then
            echo "ERROR: cxadc vermagic does not match running kernel ${running_kernel}" >&2
            exit 1
          fi

          # Record what this host is now running. Written only after every
          # verification above has passed, so a half-finished deploy leaves the
          # old stamp and the next run retries instead of skipping.
          mkdir -p "$(dirname "${stamp_file}")"
          printf '%s\n' "${new_rev}" > "${stamp_file}"
          echo "Recorded deployed revision ${new_rev}"

          echo "Deploy completed on ${{ matrix.host }}"
