name: Clockgen Firmware Build

on:
  push:
    paths:
      - clockgen/**
      - .github/workflows/clockgen-firmware.yml
  pull_request:
    paths:
      - clockgen/**
      - .github/workflows/clockgen-firmware.yml

concurrency:
  group: clockgen-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    # RP2040 firmware is host-independent, and wm is the only runner carrying
    # the ARM cross toolchain. Building it on the capture rigs would prove
    # nothing while competing with live captures.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - wm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runners have passwordless sudo only for the deploy helper, so CI cannot
      # install packages. Fail loudly with the fix instead of half-building.
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for c in git cmake make gcc g++ arm-none-eabi-gcc arm-none-eabi-g++; do
            command -v "$c" >/dev/null 2>&1 || missing+=("$c")
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing clockgen toolchain on $(hostname): ${missing[*]}"
            echo "Install them with:" >&2
            echo "  sudo dnf install -y git cmake make gcc gcc-c++ \\" >&2
            echo "    arm-none-eabi-gcc-cs arm-none-eabi-gcc-cs-c++ arm-none-eabi-newlib" >&2
            exit 1
          fi

          echo "host: $(hostname)"
          cmake --version | head -n1
          arm-none-eabi-gcc --version | head -n1

      - name: Build clockgen firmware
        run: |
          cd clockgen/scripts/ci
          bash ./ci-build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: clockgen-firmware-build
          path: |
            clockgen/firmware/build/**/firmware.uf2
            clockgen/firmware/build/build.log
            clockgen/firmware/build/build-info.txt
